# Deploys with the Vercel CLI from GitHub Actions.
# Manual only: production is deployed by the Vercel Git Integration, and running
# both on push would deploy twice. Needs the VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID repository secrets.
name: Vercel deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Vercel environment
        type: choice
        options: [preview, production]
        default: preview

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_CLI: vercel@60

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel project settings
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: pnpm dlx "$VERCEL_CLI" build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
